x-app: &app
  build: .
  env_file: .env

services:
  redis:
    image: "redis:latest"
    container_name: "gymgeniusai_redis"
    volumes:
      - redis_data:/data
  
  postgres:
    image: "postgres:15"
    container_name: "gymgeniusai_postgres"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    command: >
      sh -c "python manage.py makemigrations && python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn GymGeniusAI.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --max-requests 1000 --max-requests-jitter 50 --worker-class sync"
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    volumes:
      - static_data:/app/staticfiles
      - /root/media:/app/media
      - "/home/ubuntu/Exercise videos:/mnt/videos"
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: "gymgeniusai_nginx"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_data:/app/staticfiles
      - /root/media:/app/media
      - certbot-www:/var/www/certbot        # for ACME challenge
      - certbot-certs:/etc/letsencrypt      # for SSL certs
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

  celery:
    <<: *app
    command: celery -A GymGeniusAI worker --loglevel=info
    volumes:
      - /root/media:/app/media
    depends_on:
      - redis
  
volumes:
  redis_data:
    driver: local
  pgdata:
  static_data:
  certbot-www:
  certbot-certs:

    
