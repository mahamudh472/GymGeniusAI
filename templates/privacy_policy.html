<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - GymGeniusAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #007bff;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-size: 2.5em;
            color: #007bff;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 0.95em;
            color: #666;
        }
        
        .content {
            line-height: 1.8;
            color: #444;
        }
        
        .content h2 {
            color: #007bff;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-left: 4px solid #007bff;
            padding-left: 15px;
        }
        
        .content h3 {
            color: #0056b3;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .content p {
            margin-bottom: 15px;
            text-align: justify;
        }
        
        .content ul, .content ol {
            margin-left: 30px;
            margin-bottom: 15px;
        }
        
        .content li {
            margin-bottom: 8px;
        }
        
        .content a {
            color: #007bff;
            text-decoration: none;
            border-bottom: 1px solid #007bff;
        }
        
        .content a:hover {
            color: #0056b3;
            border-bottom-color: #0056b3;
        }
        
        .footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
        
        .updated-date {
            color: #999;
            font-style: italic;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
                margin: 10px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .content h2 {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Privacy Policy</h1>
            <p>GymGeniusAI</p>
            {% if updated_at %}
            <p class="updated-date">Last Updated: {{ updated_at|date:"F j, Y" }}</p>
            {% endif %}
        </div>
        
        <div class="content">
            {{ content|linebreaks }}
        </div>
        
        <div class="footer">
            <p>&copy; 2024 GymGeniusAI. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
