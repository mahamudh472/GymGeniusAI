  /api/workouts/generate-workouts/:
    get:
      operationId: workouts_generate_workouts_retrieve
      description: Test endpoint to generate workouts for the current user
      summary: Test endpoint for workout generation
      tags:
      - Testing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResponse'
          description: ''
    post:
      operationId: workouts_generate_workouts_create
      description: Test endpoint to generate workouts for the current user
      summary: Test endpoint for workout generation
      tags:
      - Testing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResponse'
          description: ''
  /api/workouts/track-progress/:
    get:
      operationId: workouts_track_progress_retrieve
      description: Get the current workout progress for a specific workout for today's
        session.
      summary: Get workout progress
      parameters:
      - in: query
        name: user_workout_id
        schema:
          type: integer
        description: ID of the user workout to get progress for
        required: true
        examples:
          ExampleWorkoutID:
            value: 1
            summary: Example workout ID
      tags:
      - workouts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  workout_progress:
                    type: object
                  workout_name:
                    type: string
                    example: Morning Strength Training
                  total_exercises:
                    type: integer
                    example: 5
                  completed_exercises:
                    type: integer
                    example: 2
                  completion_percentage:
                    type: number
                    example: 40.0
                  all_completed:
                    type: boolean
                    example: false
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: user_workout_id is required
          description: ''
    post:
      operationId: workouts_track_progress_create
      description: Mark an exercise in a workout as completed. Tracks progress and
        creates an Activity record when all exercises are completed.
      summary: Mark exercise as completed
      tags:
      - workouts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteExercise'
            examples:
              CompleteExerciseExample:
                value:
                  user_workout_id: 1
                  user_exercise_id: 5
                  actual_sets: 3
                  actual_reps: 12
                  actual_duration: 300
                  notes: Felt great, increased weight
                summary: Complete Exercise Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompleteExercise'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompleteExercise'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Exercise marked as completed
                  workout_progress:
                    type: object
                  all_completed:
                    type: boolean
                    example: false
                  activity_created:
                    type: boolean
                    example: false
                  activity:
                    type: object
                    nullable: true
                  completion_percentage:
                    type: number
                    example: 33.33
                  completed_exercises:
                    type: integer
                    example: 1
                  total_exercises:
                    type: integer
                    example: 3
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid input
          description: ''
components:
  schemas:
    AIConversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AIConversationDetail'
          readOnly: true
      required:
      - created_at
      - id
      - messages
      - user
    AIConversationDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender:
          $ref: '#/components/schemas/SenderEnum'
        message:
          type: string
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - message
      - sender
      - timestamp
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Name of the activity
          maxLength: 255
        duration:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Duration in minutes
        calories:
          type: number
          format: double
          description: Calories burned during the activity
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
      required:
      - calories
      - created_at
      - duration
      - id
      - name
      - user
    Article:
      type: object
      description: Serializer for Article model
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        media_url:
          type: string
          format: uri
          nullable: true
          maxLength: 255
        category:
          $ref: '#/components/schemas/CategoryEnum'
        created_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - content
      - created_at
      - created_by
      - id
      - title
    BlankEnum:
      enum:
      - ''
    CategoryEnum:
      enum:
      - fitness
      - nutrition
      - wellness
      - motivation
      - tips
      type: string
      description: |-
        * `fitness` - Fitness
        * `nutrition` - Nutrition
        * `wellness` - Wellness
        * `motivation` - Motivation
        * `tips` - Tips
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - new_password
      - old_password
    Coach:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        behavior:
          type: string
          nullable: true
      required:
      - id
      - name
