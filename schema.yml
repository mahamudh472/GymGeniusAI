openapi: 3.0.3
info:
  title: GymGenius API
  version: 1.0.0
  description: API documentation for GymGenius fitness application
paths:
  /api/accounts/change-password/:
    post:
      operationId: accounts_change_password_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePassword'
          description: ''
  /api/accounts/coaches/:
